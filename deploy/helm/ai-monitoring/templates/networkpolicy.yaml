{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-monitoring.fullname" . }}
  labels:
    {{- include "ai-monitoring.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-monitoring.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        - podSelector: {}          # same namespace
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
