# gitleaks config — extends the built-in rule set and allowlists the SYNTHETIC
# secrets that live in tests/ and .env.example by design. Real secrets are never
# committed (git-ignored `.env`, kept out of the publish allow-list), so those two
# locations are the only source of false positives. Used by the CI `secret-scan`
# job (.github/workflows/ci.yml) alongside TruffleHog.
title = "AI-Monitoring"

[extend]
useDefault = true

[allowlist]
description = "Synthetic / example values are not real secrets"
paths = [
  '''tests/.*''',
  '''\.env\.example''',
]
# Documentation prose that reads like a credential but isn't. `generic-api-key` matched the
# phrase describing the by-key candidacy filter in a CHANGELOG entry (and in an earlier
# .gitleaksignore comment that quoted it). Matching on the SECRET value is commit-independent,
# so this clears the historical commits too — no per-commit fingerprint chase. Not a real key;
# real secrets never live in docs (git-ignored `.env`, pre-publish scan + TruffleHog also cover).
regexes = [
  '''exclude/known/hidden''',
]
