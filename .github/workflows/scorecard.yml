# OpenSSF Scorecard — supply-chain security posture score.
# Publishes results to the public OpenSSF crawler (api.securityscorecards.dev)
# which serves the README badge, and uploads SARIF to code-scanning.
# Action SHAs are pinned so Scorecard's own Pinned-Dependencies check passes.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'   # weekly, Monday 04:27 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # OIDC token for publish_results (no secret needed)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: results.sarif
